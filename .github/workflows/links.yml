# Checks the links in every Markdown file: on pull requests that touch one,
# and once a week to catch pages that moved. Settings are in
# .github/lychee.toml.
#
# Actions are pinned to commit SHAs; the comment after each is its release.

name: Links

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'llms.txt'
      - '.github/lychee.toml'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Link check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .github/lychee.toml
            --no-progress
            './**/*.md'
            llms.txt
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
