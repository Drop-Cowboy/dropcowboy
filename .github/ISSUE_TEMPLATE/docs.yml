name: Docs problem
description: Something in this repo's docs is wrong, unclear or out of date.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Which file or page
      placeholder: docs/concepts/webhooks.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: What it says, and what you think it should say.
    validations:
      required: true
